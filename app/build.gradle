plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def googleWebClientId = providers.gradleProperty('googleWebClientId')
    .orElse(providers.environmentVariable('GOOGLE_WEB_CLIENT_ID'))
    .getOrElse('')
def escapedGoogleWebClientId = googleWebClientId.replace('\\', '\\\\').replace('"', '\\"')

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingValue = { String key, String envKey ->
    providers.environmentVariable(envKey)
        .orElse(signingProperties.getProperty(key, ''))
        .getOrElse('')
}
def releaseStoreFile = signingValue('storeFile', 'RELEASE_STORE_FILE')
def releaseStorePassword = signingValue('storePassword', 'RELEASE_STORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'RELEASE_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'RELEASE_KEY_PASSWORD')
def releaseSigningConfigured = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { !it.toString().trim().isEmpty() }

android {
    namespace 'id.zenithl.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'id.zenithl.launcher'
        minSdk 23
        targetSdk 33
        versionCode providers.gradleProperty('VERSION_CODE').get().toInteger()
        versionName providers.gradleProperty('VERSION_NAME').get()
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', "\"${escapedGoogleWebClientId}\""
        externalNativeBuild {
            cmake { cppFlags '-std=c++20' }
        }
    }
    buildFeatures { buildConfig true }
    ndkVersion '27.2.12479018'
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
        debug { applicationIdSuffix '.debug' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    // Keep Google ID on the Kotlin 2.0-compatible release; 1.2.1 uses Kotlin 2.4 metadata.
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
