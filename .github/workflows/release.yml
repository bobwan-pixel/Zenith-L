name: Publish ZenithL GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: zenithl-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install native build tools
        run: sdkmanager "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Determine Android version
        id: app-version
        run: echo "version_code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "::error::Missing RELEASE_KEYSTORE_BASE64 repository secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/zenith-signing"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zenith-signing/release.jks"
          test -s "$RUNNER_TEMP/zenith-signing/release.jks"

      - name: Build signed Release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/zenith-signing/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.app-version.outputs.version_code }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD" && test -n "$RELEASE_KEY_ALIAS" && test -n "$RELEASE_KEY_PASSWORD" || {
            echo "::error::Configure RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD repository secrets."
            exit 1
          }
          VERSION_NAME="${VERSION_NAME#v}"
          export VERSION_NAME
          ./gradlew assembleRelease --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
