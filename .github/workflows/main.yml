name: Build ZenithL APK

on:
  push:
    branches:
      - main
      - ui/premium-redesign
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenithl-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install native build tools
        run: sdkmanager "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Determine Android version
        id: app-version
        run: echo "version_code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run JVM tests and build Debug APK
        env:
          VERSION_CODE: ${{ steps.app-version.outputs.version_code }}
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Report lint errors on failure
        if: failure()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then grep -E ' Error:|^Lint found' "$report" || true; fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenithL-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release-apk:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install native build tools
        run: sdkmanager "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Determine Android version
        id: app-version
        run: echo "version_code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "::error::Missing RELEASE_KEYSTORE_BASE64 repository secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/zenith-signing"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zenith-signing/release.jks"
          test -s "$RUNNER_TEMP/zenith-signing/release.jks"

      - name: Build signed Release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/zenith-signing/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.app-version.outputs.version_code }}
          VERSION_NAME: 0.4.${{ steps.app-version.outputs.version_code }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD" && test -n "$RELEASE_KEY_ALIAS" && test -n "$RELEASE_KEY_PASSWORD" || {
            echo "::error::Configure RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD repository secrets."
            exit 1
          }
          ./gradlew assembleRelease --stacktrace

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenithL-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install native build tools
        run: sdkmanager "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Run Lua runtime tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          emulator-boot-timeout: 900
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

  windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android build configuration
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android configuration required by the shared build
        shell: pwsh
        run: sdkmanager "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build restricted Lua 5.4 Windows runner
        run: cmake -S desktop/native -B desktop/native/build -A x64; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; cmake --build desktop/native/build --config Release
        shell: pwsh
      - name: Test and package Windows desktop app
        run: .\\gradlew.bat :desktop:build :desktop:jpackageWindows
        shell: pwsh
      - name: Upload Windows app image
        uses: actions/upload-artifact@v4
        with:
          name: ZenithL-Windows
          path: desktop/build/windows/ZenithL
          if-no-files-found: error
