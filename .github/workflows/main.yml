
name: Build ZenithL APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare release signing key
        id: release-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/zenithl-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "status=signed" >> "$GITHUB_OUTPUT"
          else
            echo "status=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::Release keystore secrets are not configured. Release APK will be unsigned."
          fi


      - name: Install native build tools
        run: sdkmanager "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Run JVM tests and build APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Report lint errors on failure
        if: failure()
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$report" ]; then grep -E ' Error:|^Lint found' "$report" || true; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenithL-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenithL-release-${{ steps.release-signing.outputs.status }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install native build tools
        run: sdkmanager "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Run Lua runtime tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

  windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android build configuration
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android configuration required by the shared build
        shell: pwsh
        run: sdkmanager "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build restricted Lua 5.4 Windows runner
        run: cmake -S desktop/native -B desktop/native/build -A x64; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; cmake --build desktop/native/build --config Release
        shell: pwsh
      - name: Test and package Windows desktop app
        run: .\gradlew.bat :desktop:build :desktop:jpackageWindows
        shell: pwsh
      - name: Upload Windows app image
        uses: actions/upload-artifact@v4
        with:
          name: ZenithL-Windows
          path: desktop/build/windows/ZenithL
          if-no-files-found: error
          
